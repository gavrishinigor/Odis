<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ODIS</title>
  <meta name="description" content="Голосовой список задач">
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ODIS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header class="top">
      <div class="top-row">
        <div class="top-text">
          <p class="top-date" id="topDate"></p>
          <h1 class="top-title" id="topTitle">Сегодня</h1>
        </div>
        <div class="ring" id="ring" role="img" aria-label="Прогресс за сегодня">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <circle class="ring-bg" cx="22" cy="22" r="18"/>
            <circle class="ring-fg" id="ringFg" cx="22" cy="22" r="18" pathLength="100"/>
          </svg>
          <span class="ring-text" id="ringText">0/0</span>
        </div>
        <button class="icon-btn" id="openSettings" aria-label="Настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>
      <nav class="tabs" role="tablist" aria-label="Списки">
        <button class="tab" role="tab" data-view="today" aria-selected="true">Сегодня</button>
        <button class="tab" role="tab" data-view="soon" aria-selected="false">Скоро</button>
        <button class="tab" role="tab" data-view="done" aria-selected="false">Готово</button>
        <span class="tab-pill" aria-hidden="true"></span>
      </nav>
    </header>

    <main class="lists" id="lists">
      <section class="view" id="view-today" data-view="today" aria-label="Сегодня"></section>
      <section class="view" id="view-soon" data-view="soon" aria-label="Скоро" hidden></section>
      <section class="view" id="view-done" data-view="done" aria-label="Готово" hidden></section>
    </main>

    <footer class="dock" id="dock">
      <p class="dock-status" id="dockStatus" role="status" aria-live="polite"></p>
      <form class="dock-row" id="dockForm" autocomplete="off">
        <label class="sr-only" for="dockInput">Новая задача</label>
        <input class="dock-input" id="dockInput" type="text" enterkeyhint="send" placeholder="Задача или «сделано …»" maxlength="2000">
        <button class="send-btn" id="sendBtn" type="submit" aria-label="Добавить" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button class="mic-btn" id="micBtn" type="button" aria-label="Надиктовать" data-state="idle">
          <svg class="mic-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <svg class="stop-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
          <span class="spin" aria-hidden="true"></span>
          <span class="pulse" aria-hidden="true"></span>
        </button>
      </form>
    </footer>

  </div>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite" hidden>
    <span class="snack-text" id="snackText"></span>
    <button class="snack-btn" id="snackUndo" type="button">Отменить</button>
  </div>

  <!-- Шторка правки задачи -->
  <div class="scrim" id="sheetScrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grab" aria-hidden="true"></div>
    <h2 class="sheet-title" id="sheetTitle">Задача</h2>
    <form id="sheetForm" class="form">
      <label class="field"><span>Название</span>
        <textarea id="fTitle" rows="2" maxlength="200" required></textarea></label>
      <div class="field-row">
        <label class="field"><span>Дата</span><input id="fDue" type="date" required></label>
        <label class="field"><span>Время</span><input id="fTime" type="time"></label>
      </div>
      <label class="field"><span>Объект</span>
        <input id="fObject" type="text" maxlength="80" placeholder="Например, Ленина 5"></label>
      <p class="sheet-note" id="sheetNote" hidden></p>
      <div class="sheet-actions">
        <button type="button" class="btn danger" id="sheetDelete">Удалить</button>
        <button type="submit" class="btn primary" id="sheetSave">Сохранить</button>
      </div>
    </form>
  </section>

  <!-- Настройки -->
  <section class="panel" id="settings" aria-labelledby="settingsTitle" hidden>
    <header class="panel-top">
      <button class="back-btn" id="settingsBack" type="button" aria-label="Назад">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="backLabel">Назад</span>
      </button>
      <h2 class="panel-title" id="settingsTitle">Настройки</h2>
    </header>
    <div class="panel-body" id="settingsBody"></div>
  </section>

  <!-- Окно подтверждения -->
  <div class="scrim" id="modalScrim" hidden></div>
  <section class="modal" id="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText" hidden>
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-text" id="modalText"></div>
    <div class="modal-actions">
      <button class="btn" id="modalCancel" type="button">Отмена</button>
      <button class="btn primary" id="modalOk" type="button">ОК</button>
    </div>
  </section>

  <noscript><p class="noscript">Для работы ODIS нужен включённый JavaScript.</p></noscript>
</body>
</html>
